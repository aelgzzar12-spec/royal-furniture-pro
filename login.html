<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Royal Furniture Pro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f3ef;
      color: #222;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 40px 30px;
      border-radius: 18px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 35px;
    }

    .brand h1 {
      font-size: 30px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .brand p {
      color: #777;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #222;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #fff0f0;
      color: #b00020;
      font-size: 14px;
      text-align: center;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #777;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: #222;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="brand">
      <h1>Royal Furniture</h1>
      <p>Pro Admin Panel</p>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter username"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" id="loginButton">
        Login
      </button>

      <div class="error" id="errorMessage">
        Invalid username or password.
      </div>

    </form>

    <a href="index.html" class="back">
      ← Back to Store
    </a>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      const errorMessage = document.getElementById("errorMessage");
      const loginButton = document.getElementById("loginButton");

      errorMessage.style.display = "none";
      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {

        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username,
            password: password
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {

          window.location.href = "customize.html";

        } else {

          errorMessage.textContent =
            data.message || "Invalid username or password.";

          errorMessage.style.display = "block";

        }

      } catch (error) {

        errorMessage.textContent =
          "Unable to connect to the login server.";

        errorMessage.style.display = "block";

      } finally {

        loginButton.disabled = false;
        loginButton.textContent = "Login";

      }
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

  <!-- ADMIN PROTECTION -->
  <script>
    fetch("/api/auth", {
      method: "GET",
      credentials: "include",
      cache: "no-store"
    })
    .then(response => {
      if (!response.ok) {
        window.location.replace("login.html");
      }
    })
    .catch(() => {
      window.location.replace("login.html");
    });
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Royal Furniture Pro — Customize</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f3ef;
      color: #171717;
      line-height: 1.5;
    }

    header {
      background: #171717;
      color: #fff;
      padding: 20px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .back,
    .logout {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
    }

    .logout {
      border: 1px solid #555;
      background: transparent;
      padding: 8px 12px;
      border-radius: 4px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 50px 6%;
    }

    .intro {
      margin-bottom: 35px;
    }

    .intro span {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #777;
    }

    .intro h1 {
      font-size: 42px;
      margin: 8px 0 12px;
    }

    .intro p {
      color: #666;
      max-width: 650px;
    }

    .panel {
      background: #fff;
      padding: 30px;
      border: 1px solid #e4e0d9;
      margin-bottom: 25px;
    }

    .panel h2 {
      font-size: 21px;
      margin-bottom: 22px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d8d4cd;
      background: #faf9f7;
      font: inherit;
      border-radius: 3px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .product {
      border: 1px solid #e2ded7;
      padding: 22px;
      margin-bottom: 18px;
      background: #faf9f7;
    }

    .product-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .delete {
      border: 1px solid #cfcac2;
      background: #fff;
      padding: 8px 13px;
      cursor: pointer;
      font-size: 12px;
    }

    .add-product {
      border: 1px dashed #aaa;
      background: transparent;
      width: 100%;
      padding: 15px;
      cursor: pointer;
      font-weight: 600;
    }

    .save {
      width: 100%;
      background: #171717;
      color: #fff;
      border: none;
      padding: 17px;
      font-size: 15px;
      cursor: pointer;
    }

    .notice {
      display: none;
      text-align: center;
      margin-top: 15px;
      color: #555;
      font-size: 13px;
    }

    @media (max-width: 700px) {

      header {
        padding: 18px 5%;
      }

      .header-actions {
        gap: 10px;
      }

      .back {
        display: none;
      }

      main {
        padding: 35px 5%;
      }

      .intro h1 {
        font-size: 34px;
      }

      .panel {
        padding: 22px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    ROYAL PRO
  </div>

  <div class="header-actions">

    <a href="index.html" class="back">
      ← Back to Store
    </a>

    <button
      class="logout"
      onclick="logout()"
      type="button"
    >
      Logout
    </button>

  </div>

</header>

<main>

  <div class="intro">

    <span>Store Customizer</span>

    <h1>
      Customize your store
    </h1>

    <p>
      Manage your store information, homepage content,
      products, prices and images.
    </p>

  </div>

  <!-- STORE INFORMATION -->

  <section class="panel">

    <h2>
      Store Information
    </h2>

    <div class="grid">

      <div class="field">

        <label>
          Store Name
        </label>

        <input
          id="storeName"
          type="text"
          placeholder="Your Store Name"
        >

      </div>

      <div class="field">

        <label>
          Currency
        </label>

        <select id="currency">

          <option value="$">USD ($)</option>
          <option value="EGP">EGP</option>
          <option value="€">EUR (€)</option>
          <option value="£">GBP (£)</option>

        </select>

      </div>

    </div>

    <div class="field">

      <label>
        Store Description
      </label>

      <textarea
        id="storeDescription"
        placeholder="Describe your furniture store..."
      ></textarea>

    </div>

  </section>

  <!-- HERO -->

  <section class="panel">

    <h2>
      Homepage Hero
    </h2>

    <div class="field">

      <label>
        Main Heading
      </label>

      <input
        id="heroTitle"
        type="text"
        placeholder="Furniture made for modern living."
      >

    </div>

    <div class="field">

      <label>
        Hero Description
      </label>

      <textarea
        id="heroDescription"
        placeholder="Write your homepage description..."
      ></textarea>

    </div>

  </section>

  <!-- PRODUCTS -->

  <section class="panel">

    <h2>
      Product Manager
    </h2>

    <div id="products"></div>

    <button
      class="add-product"
      onclick="addProduct()"
      type="button"
    >
      + Add New Product
    </button>

  </section>

  <button
    class="save"
    onclick="saveEverything()"
    type="button"
  >
    Save Store Changes
  </button>

  <div
    id="notice"
    class="notice"
  >
    Changes saved successfully.
  </div>

</main>

<script>

  const defaultProducts = [

    {
      name: "Royal Lounge Chair",
      price: "499",
      description: "Premium upholstered chair",
      image: "assets/product-1.jpg"
    },

    {
      name: "Modern Sofa",
      price: "1299",
      description: "Contemporary living sofa",
      image: "assets/product-2.jpg"
    }

  ];


  function createProduct(product) {

    const wrapper =
      document.createElement("div");

    wrapper.className = "product";

    wrapper.innerHTML = `

      <div class="product-top">

        <strong>
          Product
        </strong>

        <button
          class="delete"
          type="button"
          onclick="deleteProduct(this)"
        >
          Delete
        </button>

      </div>

      <div class="grid">

        <div class="field">

          <label>
            Product Name
          </label>

          <input
            class="product-name"
            type="text"
            value="${escapeHtml(product.name)}"
          >

        </div>

        <div class="field">

          <label>
            Price
          </label>

          <input
            class="product-price"
            type="number"
            value="${escapeHtml(product.price)}"
          >

        </div>

      </div>

      <div class="field">

        <label>
          Product Description
        </label>

        <input
          class="product-description"
          type="text"
          value="${escapeHtml(product.description)}"
        >

      </div>

      <div class="field">

        <label>
          Product Image URL
        </label>

        <input
          class="product-image"
          type="text"
          value="${escapeHtml(product.image)}"
          placeholder="assets/product.jpg"
        >

      </div>

    `;

    document
      .getElementById("products")
      .appendChild(wrapper);

  }


  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

  }


  function loadSettings() {

    const settings =
      JSON.parse(
        localStorage.getItem("royalFurnitureProSettings")
      ) || {};

    document.getElementById("storeName").value =
      settings.storeName || "Royal Furniture";

    document.getElementById("currency").value =
      settings.currency || "$";

    document.getElementById("storeDescription").value =
      settings.storeDescription ||
      "A curated selection of furniture created for contemporary interiors and elegant spaces.";

    document.getElementById("heroTitle").value =
      settings.heroTitle ||
      "Furniture made for modern living.";

    document.getElementById("heroDescription").value =
      settings.heroDescription ||
      "Discover refined furniture pieces designed to bring comfort, character and timeless style into your space.";

    const savedProducts =
      JSON.parse(
        localStorage.getItem("royalFurnitureProProducts")
      );

    const products =
      savedProducts || defaultProducts;

    document.getElementById("products").innerHTML = "";

    products.forEach(product => {
      createProduct(product);
    });

  }


  function addProduct() {

    createProduct({

      name: "New Product",

      price: "0",

      description: "Product description",

      image: "assets/product.jpg"

    });

  }


  function deleteProduct(button) {

    const product =
      button.closest(".product");

    product.remove();

  }


  function collectProducts() {

    const products = [];

    document
      .querySelectorAll(".product")
      .forEach(product => {

        const name =
          product
            .querySelector(".product-name")
            .value
            .trim();

        const price =
          product
            .querySelector(".product-price")
            .value
            .trim();

        const description =
          product
            .querySelector(".product-description")
            .value
            .trim();

        const image =
          product
            .querySelector(".product-image")
            .value
            .trim();

        if (name) {

          products.push({

            name: name,

            price: price,

            description:
              description || "Furniture product",

            image:
              image || "assets/product.jpg"

          });

        }

      });

    return products;

  }


  function saveEverything() {

    const settings = {

      storeName:
        document
          .getElementById("storeName")
          .value
          .trim(),

      currency:
        document
          .getElementById("currency")
          .value,

      storeDescription:
        document
          .getElementById("storeDescription")
          .value
          .trim(),

      heroTitle:
        document
          .getElementById("heroTitle")
          .value
          .trim(),

      heroDescription:
        document
          .getElementById("heroDescription")
          .value
          .trim()

    };

    const products =
      collectProducts();

    localStorage.setItem(
      "royalFurnitureProSettings",
      JSON.stringify(settings)
    );

    localStorage.setItem(
      "royalFurnitureProProducts",
      JSON.stringify(products)
    );

    const notice =
      document.getElementById("notice");

    notice.style.display = "block";

    setTimeout(() => {

      notice.style.display = "none";

    }, 2500);

  }


  async function logout() {

    try {

      await fetch("/api/logout", {
        method: "POST",
        credentials: "include",
        cache: "no-store"
      });

    } catch (error) {

      console.log("Logout request failed.");

    }

    window.location.replace("login.html");

  }


  loadSettings();

</script>

</body>
</html>
